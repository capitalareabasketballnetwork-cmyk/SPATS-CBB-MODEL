name: Calculate 2027 team talent
on:
  push:
    paths:
      - scripts/rank_2027_team_talent.py
      - .github/workflows/rank-2027-team-talent.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rank_2027_team_talent.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/2027_team_talent_rankings.csv
          git diff --cached --quiet || (git commit -m "Save 2027 team talent ratings" && git push)
