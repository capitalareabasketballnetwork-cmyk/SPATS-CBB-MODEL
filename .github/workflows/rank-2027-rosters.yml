name: Rank 2027 rosters by SPATS
on:
  push:
    paths:
      - scripts/rank_2027_rosters.py
      - .github/workflows/rank-2027-rosters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rank_2027_rosters.py
      - name: Commit ranked rosters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/2027_roster_spats_rankings.csv
          git diff --cached --quiet || (git commit -m "Store 2027 roster SPATS rankings" && git push)
