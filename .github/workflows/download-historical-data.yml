name: Download historical CBB data
on:
  workflow_dispatch:
    inputs:
      first_season:
        description: First season ending year
        required: true
        default: '2003'
      last_season:
        description: Last season ending year
        required: true
        default: '2026'
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install and verify hoopR
        run: |
          Rscript -e 'install.packages("hoopR", repos="https://cloud.r-project.org", dependencies=TRUE); if (!requireNamespace("hoopR", quietly=TRUE)) stop("hoopR installation failed"); print(packageVersion("hoopR"))'
      - name: Download season box scores
        run: Rscript scripts/download_hoopr.R "${{ inputs.first_season }}" "${{ inputs.last_season }}"
      - name: Upload downloaded datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-player-boxscores-${{ inputs.first_season }}-${{ inputs.last_season }}
          path: data/raw/hoopr/
          retention-days: 90
          if-no-files-found: warn
