name: Calculate MSU player values
on:
  workflow_dispatch:
jobs:
  calculate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::hoopR
      - name: Calculate Michigan State player value
        run: Rscript scripts/calculate_msu_2026.R
      - name: Upload calculated values
        uses: actions/upload-artifact@v4
        with:
          name: michigan-state-2026-player-values
          path: output/michigan_state_2026_player_values.csv
          retention-days: 90
