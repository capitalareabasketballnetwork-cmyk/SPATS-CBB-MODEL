name: Build historical player percentiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_all_player_percentiles.R'
      - '.github/workflows/build-player-percentiles.yml'
permissions:
  contents: write
concurrency:
  group: cbb-percentile-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::hoopR
      - name: Build each season independently
        run: Rscript scripts/build_all_player_percentiles.R 2003 2026
      - name: Validate output
        run: |
          python - <<'PY'
          import csv, pathlib
          root=pathlib.Path('data/processed/player_percentiles')
          files=list(root.glob('player_percentiles_*.csv'))
          assert len(files)==24, f'Expected 24 seasons, got {len(files)}'
          for p in files:
              with p.open() as f:
                  rows=list(csv.DictReader(f))
              assert rows, f'Empty: {p}'
              assert all(r['season']==p.stem.split('_')[-1] for r in rows), p
              assert all(r['spats_rating']!='' or r['team_value_pct']=='' for r in rows), p
          print('Validated 24 separate season files')
          PY
      - name: Commit season data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/player_percentiles/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Store SPATS national player percentiles by season (2003-2026)"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spats-player-percentiles-2003-2026
          path: data/processed/player_percentiles/
          retention-days: 90
